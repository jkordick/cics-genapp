name: Copilot Setup Steps

# Prepares the environment for the Copilot coding agent. These steps run
# before the agent's firewall is enabled, so the test container image (which
# downloads Ubuntu packages) is built here and reused by `test/run.sh`.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job must be called copilot-setup-steps to be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build test image and compile GenApp
        run: test/run.sh --setup-only
